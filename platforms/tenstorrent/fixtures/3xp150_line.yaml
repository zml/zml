# Synthetic cluster descriptor (tt-umd format), written by hand for the topology tests;
# not captured from hardware. Board ids use the p150a UPI 0x40; unique ids follow
# UMD (board_id << 5 | asic_location) for chips with a trained link.
#
# Three p150a in a line: A-B on ports 1-1, B-C on ports 2-2.
arch:
  0: blackhole
  1: blackhole
  2: blackhole
chips:
  {}
chip_unique_ids:
  0: 140737488486432
  1: 140737488486464
  2: 140737488486496
ethernet_connections:
  -
    - chip: 0
      chan: 11
    - chip: 1
      chan: 11
  -
    - chip: 0
      chan: 9
    - chip: 1
      chan: 9
  -
    - chip: 1
      chan: 8
    - chip: 2
      chan: 8
  -
    - chip: 1
      chan: 10
    - chip: 2
      chan: 10
ethernet_connections_to_remote_devices:
  []
chips_with_mmio:
  - 0: 0
  - 1: 1
  - 2: 2
io_device_type: PCIe
harvesting:
  0:
    noc_translation: true
    harvest_mask: 192
    dram_harvesting_mask: 0
    eth_harvesting_mask: 288
    pcie_harvesting_mask: 2
    l2cpu_harvesting_mask: 0
  1:
    noc_translation: true
    harvest_mask: 192
    dram_harvesting_mask: 0
    eth_harvesting_mask: 288
    pcie_harvesting_mask: 2
    l2cpu_harvesting_mask: 0
  2:
    noc_translation: true
    harvest_mask: 192
    dram_harvesting_mask: 0
    eth_harvesting_mask: 288
    pcie_harvesting_mask: 2
    l2cpu_harvesting_mask: 0
chip_to_bus_id:
  0: "0x01"
  1: "0x21"
  2: "0x41"
boards:
  -
    - board_id: 4398046515201
    - board_type: p150
    - chips:
        - 0
  -
    - board_id: 4398046515202
    - board_type: p150
    - chips:
        - 1
  -
    - board_id: 4398046515203
    - board_type: p150
    - chips:
        - 2
asic_locations:
