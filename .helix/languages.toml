[[language]]
auto-format = true
file-types = ["zig"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["zls"]
name = "zig"
roots = ["build.zig","build.zig.zon", "zls.build.json"]
scope = "source.zig"

[language-server.zls]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel)/tools/zls.sh\" \"$@\"", "zls"]

