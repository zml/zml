images:
  ubuntu24-amd64:
    platform: "linux"
    arch: "amd64"
    ami: "ami-04a92520784b93e73"

  ubuntu24-arm64:
    platform: "linux"
    arch: "arm64"
    ami: "ami-035c36ba717c3d79f"

runners:
  large-runner-amd64:
    cpu: [16]
    family: ["c8", "c7"]
    image: ubuntu24-amd64
    volume: 80gb
    extras: ["s3-cache"]

  large-runner-arm64:
    cpu: [16]
    family: ["c8g", "c7g"]
    image: ubuntu24-arm64
    volume: 80gb
    extras: ["s3-cache"]

  small-runner-amd64:
    cpu: [4]
    family: ["c8", "c7"]
    image: ubuntu24-amd64
    volume: 80gb
    extras: ["s3-cache"]
