name: ci
on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'master')}}

jobs:
  ci:
    name: ci-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            bazel_opts: ""
            run_tests: true
            runner_labels:
              - runs-on=${{ github.run_id }}-${{ github.run_attempt }}-ci-cpu
              - runner=16cpu-linux-x64
              - family=c8+c7
              - image=ubuntu24-amd64
              - volume=80gb
              - extras=s3-cache

          - target: neuron
            bazel_opts: "--@zml//platforms:neuron=true --@zml//platforms:cpu=false"
            run_tests: false
            runner_labels:
              - runs-on=${{ github.run_id }}-${{ github.run_attempt }}-ci-neuron
              - runner=16cpu-linux-x64
              - family=c8+c7
              - image=ubuntu24-amd64
              - volume=80gb
              - extras=s3-cache

          - target: tpu
            bazel_opts: "--@zml//platforms:tpu=true --@zml//platforms:cpu=false"
            run_tests: false
            runner_labels:
              - runs-on=${{ github.run_id }}-${{ github.run_attempt }}-ci-tpu
              - runner=16cpu-linux-x64
              - family=c8+c7
              - image=ubuntu24-amd64
              - volume=80gb
              - extras=s3-cache

          - target: cuda
            bazel_opts: "--@zml//platforms:cuda=true --@zml//platforms:cpu=false"
            run_tests: true
            runner_labels: ["self-hosted", "platform=cuda"]

          - target: rocm
            bazel_opts: "--@zml//platforms:rocm=true --@zml//platforms:cpu=false"
            run_tests: true
            runner_labels: ["self-hosted", "platform=rocm"]

          # - target: metal
          #   bazel_opts: "--@zml//platforms:metal=true --@zml//platforms:cpu=false"
          #   run_tests: true
          #   runner_labels: ["self-hosted", "macOS", "ARM64"]

    runs-on: ${{ matrix.runner_labels }}
    steps:
      - uses: runs-on/action@v2.1.0
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure self hosted cache permissions
        run: mkdir -p /tmp/zig-cache && mkdir -p /tmp/zml && sudo chmod -R 777 /tmp/zig-cache && sudo chmod -R 777 /tmp/zml

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          cache-save: false
          bazelrc: |
            startup --experimental_remote_repo_contents_cache
            common --verbose_failures
            common --keep_going
            common --test_output=streamed
            common --color=yes
            common --show_timestamps
            common --config=remote
            common --strategy=TestRunner=local
            ${{ format('common:remote --remote_header=x-buildbuddy-api-key={0}', secrets.BUILDBUDDY_CI_API_KEY) || '' }}

      - run: bazel mod graph
      - run: bazel query --output=graph ${{ matrix.bazel_opts }} //...
      - run: bazel cquery ${{ matrix.bazel_opts }} //...
      - run: bazel build ${{ matrix.bazel_opts }} //...
      - if: ${{ matrix.run_tests }}
        run: bazel test ${{ matrix.bazel_opts }} //...

  lint:
    runs-on:
      - runs-on=${{ github.run_id }}-${{ github.run_attempt }}-lint
      - runner=4cpu-linux-x64
      - image=ubuntu24-amd64
      - volume=80gb
      - extras=s3-cache
    steps:
      - uses: runs-on/action@v2.1.0
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          mirror: https://mirror.zml.ai/zig

      - name: Zig Format
        run: zig fmt --check  $(git ls-files --exclude-standard -- ':!third_party/*' '*.zig' | xargs)

      - name: No autofix in Zig code
        run: bash -c "! git grep -l '// autofix' -- '*.zig'"
